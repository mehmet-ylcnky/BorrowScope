<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BorrowScope - Technical Whitepapers</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container { max-width: 800px; text-align: center; }
        h1 { color: #fff; font-size: 3rem; margin-bottom: 0.5rem; }
        .subtitle { color: #8892b0; font-size: 1.2rem; margin-bottom: 3rem; }
        .papers { display: grid; gap: 1.5rem; }
        .paper {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 2rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .paper:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-4px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .paper h2 { color: #64ffda; font-size: 1.5rem; margin-bottom: 0.5rem; }
        .paper p { color: #8892b0; line-height: 1.6; }
        .paper .tag {
            display: inline-block;
            background: rgba(100,255,218,0.1);
            color: #64ffda;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦀 BorrowScope</h1>
        <p class="subtitle">Technical Whitepapers & Documentation</p>
        <div class="papers">
            <a href="borrowscope-runtime/" class="paper">
                <h2>BorrowScope Runtime</h2>
                <p>A comprehensive technical whitepaper on runtime ownership tracking for Rust. Covers event-sourced architecture, zero-cost abstractions, and ownership graph construction.</p>
                <span class="tag">v0.1.1</span>
            </a>
        </div>
    </div>
</body>
</html>
