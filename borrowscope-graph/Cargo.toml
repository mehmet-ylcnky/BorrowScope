[package]
name = "borrowscope-graph"
version = "0.1.0"
edition = "2021"
description = "Graph algorithms for ownership analysis"
license = "Apache-2.0"

[dependencies]
borrowscope-runtime = { path = "../borrowscope-runtime", features = ["track"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
proptest = "1"

[[bench]]
name = "graph_bench"
harness = false

[dev-dependencies.criterion]
version = "0.5"
