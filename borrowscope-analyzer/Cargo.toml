[package]
name = "borrowscope-analyzer"
version = "0.1.0"
edition = "2021"
description = "Static type analyzer for borrowscope using rust-analyzer"

[dependencies]
# rust-analyzer crates for syntax parsing
ra_ap_syntax = "0.0.232"

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.4"
