[package]
name = "borrowscope-lsp"
version = "0.1.0"
edition = "2021"
description = "BorrowScope Language Server - real-time ownership visualization"
license = "Apache-2.0"

[[bin]]
name = "borrowscope-lsp"
path = "src/main.rs"

[dependencies]
# LSP protocol
lsp-server = "0.7"
lsp-types = "0.97"

# rust-analyzer semantic engine (same versions as borrowscope-analyzer)
ra_ap_hir = "0.0.318"
ra_ap_ide_db = "0.0.318"
ra_ap_load-cargo = "0.0.318"
ra_ap_project_model = "0.0.318"
ra_ap_vfs = "0.0.318"
ra_ap_vfs-notify = "0.0.318"
ra_ap_syntax = "0.0.318"
ra_ap_hir_ty = "0.0.318"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Concurrency
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1"
